<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria's Secret Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #222222;
        }
        header {
            background: #ffb6c1;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .container {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-bottom: 80px;
        }
        .product-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .product-title {
            font-size: 14px;
            margin: 8px 0;
            font-weight: 600;
        }
        .product-price {
            font-weight: bold;
            color: #e91e63;
            margin-bottom: 8px;
        }
        .btn-add {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>VICTORIA'S SECRET</header>

    <div class="container" id="catalog">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=300" class="product-img" alt="Парфюм">
            <div class="product-title">Bombshell Eau de Parfum</div>
            <div class="product-price">1200 ₴</div>
            <button class="btn-add" onclick="addToCart('Bombshell Perfume', 1200)">В корзину</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1615396899839-c99c121888b0?w=300" class="product-img" alt="Спрей">
            <div class="product-title">Body Mist Pure Seduction</div>
            <div class="product-price">450 ₴</div>
            <button class="btn-add" onclick="addToCart('Body Mist Pure Seduction', 450)">В корзину</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateMainButton();
        }

        function updateMainButton() {
            if (cart.length > 0) {
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                tg.MainButton.text = `Оформить заказ: ${total} ₴ (${cart.length} шт.)`;
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        tg.onEvent('mainButtonClicked', function() {
            const orderData = {
                items: cart,
                total: cart.reduce((sum, item) => sum + item.price, 0)
            };
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });
    </script>
</body>
</html>
